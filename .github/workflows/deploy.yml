# Publica o site Astro no GitHub Pages.
# Requer: Settings → Pages → Build and deployment → Source = "GitHub Actions"
# (no modo "Deploy from a branch" o GitHub tenta usar Jekyll e falha com arquivos .astro).
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Site de pré-visualização em https://bernardomonteiro-ui.github.io/DM-ADVOCACIA
      SITE_URL: https://bernardomonteiro-ui.github.io
      BASE_PATH: /DM-ADVOCACIA
      # Preview fora do Google até o domínio definitivo. Ao publicar no domínio próprio,
      # trocar SITE_URL/BASE_PATH e remover esta linha.
      PUBLIC_NOINDEX: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Checagem de tipos e lint
        run: npm run verify

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
